<!doctype html>
<html lang="en">
<head>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer — Jué Chen</title>
<meta name="robots" content="noindex,follow">
<!-- build:icons start -->
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff">
<!-- build:icons end -->
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="header">
  <nav class="nav" aria-label="Primary">
    <!-- build:nav start -->
    <a class="brand" href="/">陳</a>

    <!-- Desktop links -->
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="projects.html">Projects</a>
      <a class="nav-child" href="the-meadow.html">The Meadow</a>
      <a href="studies.html">Studies</a>
      <a href="about.html">About</a>
    </div>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- Mobile dropdown -->
    <div class="nav-panel" aria-hidden="true">
      <a href="/">Home</a>
      <a href="projects.html">Projects</a>
      <a class="nav-child" href="the-meadow.html">The Meadow</a>
      <a href="studies.html">Studies</a>
      <a href="about.html">About</a>
    </div>
<!-- build:nav end -->
  </nav>
</header>
  
<main>

<div class="viewer-wrap">
  <div class="viewer-stage"><!-- filled by assets/viewer.js --></div>

  <div class="viewer-caption" aria-live="polite">
    <div class="cap-title" id="capTitle"></div>
    <div class="cap-sub" id="capSub"></div>
  </div>

  <div class="viewer-bar">
    <div class="counter" id="counter"></div>

    <div class="controls">
      <a class="btn" id="backLink" href="./" aria-label="Back to grid">⧉ Grid</a>
      <button class="btn" id="prevBtn" aria-label="Previous">←</button>
      <button class="btn" id="nextBtn" aria-label="Next">→</button>
    </div>
  </div>
</div>

<footer class="footer">
  <!-- build:footer start -->
  <div class="footer-inner">
    <div class="footer-left">© 2026 Jué Chen • 陳覺</div>
    <a class="footer-right" href="https://instagram.com/veryjc" target="_blank" rel="noreferrer">Instagram</a>
  </div>
<!-- build:footer end -->
</footer>
  
</main>
<script src="assets/viewer.js"></script>
<script src="assets/nav.js" defer></script>
</body>
</html>
